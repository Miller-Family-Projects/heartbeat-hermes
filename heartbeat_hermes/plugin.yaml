name: heartbeat-hermes
version: "0.2.0"
description: "Thin adapter over one heartbeat-core child: the Core owns scheduling, durable policy and the agent tools; the plugin owns registration, trusted route binding, native delivery and receipts. Wakes arrive as internal synthetic events with explicit delivery receipts; the plugin never composes chat text."
author: "heartbeat-hermes contributors"
hooks:
  - pre_gateway_dispatch
  - pre_llm_call
  - post_gateway_admission
